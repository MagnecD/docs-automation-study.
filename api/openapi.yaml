openapi: 3.0.0
info:
  title: API для входа
  version: 1.0.0
  description: Учебный пример описания функции авторизации.
paths:
  /login:
    post:
      summary: Авторизация пользователя
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - login
                - password
              properties:
                login:
                  type: string
                  example: student
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Успешная обработка запроса (учебный пример)
